name: CI

on:
  push:
  pull_request:

jobs:
  game-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: game-service/pom.xml
      # Testcontainers utilise le Docker deja present sur le runner.
      - run: ./mvnw -B test

  live-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: live-service/pom.xml
      - run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
